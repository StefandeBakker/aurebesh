name: Deploy demo to GitHub Pages

# Publishes the demo page (demo/index.html) with the freshly built editor as a small static site.
# One-time setup: in the repository go to Settings -> Pages and set Source to "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'package.json'
      - 'tsup.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/dist
          cp dist/*.js _site/dist/
          # the demo imports ../dist/ so it also works from the repository; on the site dist/ sits next to it
          sed 's#\.\./dist/#./dist/#' demo/index.html > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
