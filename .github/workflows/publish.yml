name: Publish to npm

# Runs when a release is published on GitHub (Releases -> Draft a new release, tag e.g. v1.0.1).
# It stages with npm "trusted publishing": no npm token is stored anywhere, GitHub proves to npm
# which repository and workflow this is (OIDC) and npm adds a provenance statement to the package.
# A maintainer must approve the staged package on npm with 2FA before it goes live.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # needed for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, staged publishing needs npm 11.15.0 or newer
          registry-url: https://registry.npmjs.org

      # The npm that comes with Node 24 can be older than 11.15.0, the first version with `npm stage`.
      - name: Use a recent npm
        run: npm install -g npm@latest

      - name: The release tag must match the version in package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # prepublishOnly builds the package. A version with a dash (1.1.0-beta.0) goes out under the "beta" tag,
      # so it never becomes what `npm install aurebesh` gives people.
      - name: Stage package for npm approval
        run: |
          if node -p "require('./package.json').version" | grep -q -- '-'; then
            npm stage publish --tag beta
          else
            npm stage publish
          fi
